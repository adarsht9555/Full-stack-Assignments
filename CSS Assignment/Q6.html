<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f1f5f9;
        }

        main {
            padding: 50px 7%;
        }

        h1 {
            text-align: center;
            margin-bottom: 40px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        figure {
            position: relative;
            overflow: hidden;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        figure img {
            width: 100%;
            height: 250px;
            display: block;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        figure:hover img {
            transform: scale(1.1);
        }

        figcaption {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 15px;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            text-align: center;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        figure:hover figcaption {
            opacity: 1;
        }

        @media (max-width: 800px) {
            .gallery {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 500px) {
            .gallery {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <main>

        <h1>My Photo Gallery</h1>

        <div class="gallery">

            <figure>
                <img src="image1.jpg" alt="Mountain">
                <figcaption>Beautiful Mountain</figcaption>
            </figure>

            <figure>
                <img src="image2.jpg" alt="Beach">
                <figcaption>Peaceful Beach</figcaption>
            </figure>

            <figure>
                <img src="image3.jpg" alt="Forest">
                <figcaption>Green Forest</figcaption>
            </figure>

            <figure>
                <img src="image4.jpg" alt="City">
                <figcaption>Modern City</figcaption>
            </figure>

            <figure>
                <img src="image5.jpg" alt="Lake">
                <figcaption>Beautiful Lake</figcaption>
            </figure>

            <figure>
                <img src="image6.jpg" alt="Sunset">
                <figcaption>Sunset View</figcaption>
            </figure>

        </div>

    </main>

</body>
</html>
