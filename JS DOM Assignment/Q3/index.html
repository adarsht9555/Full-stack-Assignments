<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-Step Form</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Registration Form</h1>
    <p id="stepLabel">Step 1 of 3</p>
    <form id="registrationForm" novalidate>
      <section class="form-step active" data-step="0">
        <label for="fullName">Name</label>
        <input id="fullName" name="fullName" type="text" autocomplete="name" required>
        <p class="error" id="nameError"></p>
      </section>
      <section class="form-step" data-step="1">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
        <p class="error" id="emailError"></p>
      </section>
      <section class="form-step" data-step="2">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="new-password" minlength="6" required>
        <p class="error" id="passwordError"></p>
      </section>
      <div class="buttons">
        <button id="backButton" type="button" disabled>Back</button>
        <button id="nextButton" type="button">Next</button>
      </div>
    </form>
    <section id="summary" hidden>
      <h2>Summary</h2>
      <p id="summaryName"></p>
      <p id="summaryEmail"></p>
      <p>Password: <span>Saved (not displayed for privacy)</span></p>
      <button id="restartButton" type="button">Start Again</button>
    </section>
  </main>
  <script src="Q3.js"></script>
</body>
</html>
