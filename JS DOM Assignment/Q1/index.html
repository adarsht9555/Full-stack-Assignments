<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic Product List Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Product List Manager</h1>
    <form id="productForm">
      <input id="productInput" type="text" placeholder="Enter product name" aria-label="Product name" required>
      <button type="submit">Add Product</button>
    </form>
    <ul id="productList"></ul>
    <p class="hint">Use Edit to change a product. Clicking elsewhere saves the edit.</p>
  </main>
  <script src="Q1.js"></script>
</body>
</html>
