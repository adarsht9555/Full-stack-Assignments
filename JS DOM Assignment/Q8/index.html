<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom Dropdown</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Custom Dropdown</h1>
    <div id="dropdown" class="dropdown">
      <button id="dropdownButton" type="button" aria-expanded="false">Choose a course ▾</button>
      <div id="dropdownOptions" class="options" hidden>
        <button type="button" data-value="Cybersecurity">Cybersecurity</button>
        <button type="button" data-value="Artificial Intelligence">Artificial Intelligence</button>
        <button type="button" data-value="Web Development">Web Development</button>
        <button type="button" data-value="Cloud Computing">Cloud Computing</button>
      </div>
    </div>
    <p>Selected: <strong id="selectedValue">None</strong></p>
  </main>
  <script src="Q8.js"></script>
</body>
</html>
